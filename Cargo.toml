[workspace]
resolver = "2"
members = ["core", "ui"]

[workspace.dependencies]
tantivy = "0.25"
eframe = "0.32"
walkdir = "2"
notify = "8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
thiserror = "2"
zip = "2"
lopdf = "0.34"
tempfile = "3"
winapi = { version = "0.3", features = ["synchapi", "handleapi", "errhandlingapi", "winerror"] }
winreg = "0.10"
tray-icon = "0.21"
global-hotkey = "0.6"
